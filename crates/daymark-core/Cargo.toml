[package]
name = "daymark-core"
version = "0.1.0"
edition = "2021"
description = "刻忆的核心逻辑：公历/农历换算、下一次日期、提醒阶段判断与本地存储"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
