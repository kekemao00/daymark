name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: 核心逻辑单测
        run: cargo test -p daymark-core
      - name: 农历逐日对照（1901–2099）
        run: npm run verify:lunar
      - name: 前端类型检查、单测与构建
        run: |
          npm test
          npm run build

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: 构建 Windows 安装包
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: daymark-windows-installer
          path: target/release/bundle/nsis/*.exe
