name: Release

# 推送 v* 标签（如 v0.1.0），或在 Actions 页面手动运行并填写版本，
# 会在 Windows 上构建安装包并发布到 GitHub Releases（手动运行时自动在当前提交上打标签）。
# 发布说明取自 .github/release-notes/<标签>.md，没有该文件时自动生成。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的版本标签，如 v0.1.0
        required: true

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: 校验标签与应用版本一致
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "标签 $TAG 与 tauri.conf.json 的版本 $version 不一致"; exit 1
          fi
      - name: 核心逻辑单测
        run: cargo test -p daymark-core
      - name: 构建安装包
        run: npx tauri build
      - name: 发布
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${TAG#v}
          # GitHub 附件名不支持中文，改成英文文件名
          asset="Daymark_${version}_x64-setup.exe"
          cp target/release/bundle/nsis/*.exe "$asset"
          notes=".github/release-notes/$TAG.md"
          if [ -f "$notes" ]; then notes_args=(--notes-file "$notes"); else notes_args=(--generate-notes); fi
          gh release create "$TAG" "$asset#刻忆 ${version} Windows 安装包" \
            --target "$GITHUB_SHA" --title "刻忆 $TAG" "${notes_args[@]}"
