[package]
name = "daymark"
version = "0.2.0"
description = "刻忆：重要日期主动提醒"
edition = "2021"
license = "MIT"

[lib]
name = "daymark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
daymark-core = { path = "../crates/daymark-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
semver = "1.0.28"
tokio = { version = "1.53.3", default-features = false, features = ["time"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["native-tls", "system-proxy"] }
tauri-plugin-window-state = "2.5.0"
